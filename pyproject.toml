[build-system]
requires = ["setuptools>=42", "wheel", "pybind11", "torch ==2.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torch_ans"
version = "0.2.0"
description = "PyTorch extension for ANS-based compression (C++/CUDA)"
authors = [{ name = "worldlife", email = "worldlife@sjtu.edu.cn" }]
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch ==2.13.0", "pybind11"]

[dependency-groups]
dev = ["wheel", "build", "pytest", "pytest-cov", "pytest-benchmark", "gcovr"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.pytest.ini_options]
# addopts = "--cov=torch_ans --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
